# dsh-subagent-roles bundle patch: inserts the role matrix plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-subagent-roles`.
#
# One package, both halves: the node half (exports ".") mounts the
# loopback-fenced /subagent-roles/api/* routes that read and rewrite the
# preset's role chains, and the browser half (declared by `dsh.client`,
# served from lib/client.js) contributes the "Subagent roles" settings
# section that talks to those routes same-origin.
- insert:
    - id: subagent-roles
      name: '@linxin666/dsh-client-ui-subagent-roles'
